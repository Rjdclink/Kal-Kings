name: Kal Kings sports-only regression verification
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sports-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run complete Node test suite ten consecutive times
        shell: bash
        run: |
          set -euo pipefail
          for pass in $(seq 1 10); do
            echo "::group::Verification pass $pass/10"
            node --test kal_kings_platform/*.test.mjs
            echo "::endgroup::"
          done
      - name: Confirm crypto order path is absent
        shell: bash
        run: |
          ! grep -R -n -E 'runCryptoCycle|fetchFinalCryptoConsensus|selectCryptoIdea|rankCryptoCandidates|CRYPTO_DIRECTIONAL_CONSENSUS' kal_kings_platform/index.mjs kal_kings_platform/directional_runner.mjs kal_kings_platform/solo_runner.mjs kal_kings_platform/dashboard.html kal_kings_platform/predictive_feeds.mjs
